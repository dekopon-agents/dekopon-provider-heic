[workspace]

[package]
name = "dekopon-heic-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Experimental bounded pure-Rust HEIC to PNG provider for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-heic"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = { git = "https://github.com/dekopon-agents/dekopon", rev = "fcb484bf17581735f47c89c1d7737729d28d6b6d", features = ["clap"] }
heic-rs = { version = "=0.1.1", default-features = false, features = ["std"] }
base64 = "=0.22.1"
png = "=0.18.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
dekopon-provider-sdk-testkit = { git = "https://github.com/dekopon-agents/dekopon", rev = "fcb484bf17581735f47c89c1d7737729d28d6b6d" }
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
